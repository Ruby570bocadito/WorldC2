name: WORLDC2 C2 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Go dependencies
        run: cd src/go && go mod download

      - name: Run Go tests (race + coverage)
        run: cd src/go && go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: src/go/coverage.out
          fail_ci_if_error: false

      - name: Run Go vet
        run: cd src/go && go vet ./...

      - name: Check Go formatting
        run: |
          cd src/go
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Python syntax check
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Build server and agent
        run: |
          mkdir -p ../../dist
          cd src/go
          go build -o ../../dist/worldc2-server ./cmd/server
          go build -o ../../dist/worldc2-agent ./cmd/agent

      - name: Run API functional tests
        run: |
          cp config.example.yaml config.yaml
          ./dist/worldc2-server -config config.yaml -no-tls &
          SERVER_PID=$!
          sleep 4
          python3 tests/run_tests.py --server http://127.0.0.1:9090
          EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT

      - name: Run E2E tests
        run: |
          rm -f worldc2.db
          cp config.example.yaml config.yaml
          # e2e_test.py starts and stops its own server binary (dist/)
          timeout 180 python3 tests/e2e_test.py

      - name: Run penetration self-tests
        run: |
          rm -f worldc2.db
          cp config.example.yaml config.yaml
          # pentest.py starts and stops its own server binary (dist/)
          timeout 120 python3 tests/pentest.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Check for XSS sinks
        run: |
          if grep -rn "v-html\|innerHTML" web/src/; then
            echo "ERROR: raw HTML sinks are forbidden in this project"
            exit 1
          fi

  build:
    needs: [test, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: worldc2-server-linux
          - goos: linux
            goarch: arm64
            artifact: worldc2-server-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: worldc2-server-windows.exe
          - goos: darwin
            goarch: amd64
            artifact: worldc2-server-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: worldc2-server-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: worldc2-agent-linux
            agent: true
          - goos: windows
            goarch: amd64
            artifact: worldc2-agent-windows.exe
            agent: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: cd src/go && go mod download

      - name: Build ${{ matrix.artifact }}
        run: |
          cd src/go
          if [ "${{ matrix.agent }}" = "true" ]; then
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags="-s -w" -o ../${{ matrix.artifact }} ./cmd/agent
          else
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags="-s -w" -o ../${{ matrix.artifact }} ./cmd/server
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  docker:
    needs: [test, web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t worldc2-c2:latest .

      - name: Run Docker container
        run: |
          docker run -d --name worldc2-test \
            -p 9090:9090 \
            worldc2-c2:latest
          sleep 5
          curl -f http://localhost:9090/api/health || exit 1
          docker stop worldc2-test
          docker rm worldc2-test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Security audit (hardening checks)
        run: python3 scripts/harden.py --project .

      - name: Scan for hardcoded secrets
        run: |
          # Look for likely credentials in source (not in the documented
          # example config, which intentionally shows a bcrypt placeholder).
          FOUND=0
          for pat in "password.*=.*\"[A-Za-z0-9!@#$%^&*]{8,}\"" "token.*=.*\"[a-f0-9]{32,}\"" "api_key.*=.*['\"][A-Za-z0-9]{16,}"; do
            if grep -rniE "$pat" scripts/ src/go/cmd/ tests/ --include="*.py" --include="*.go" 2>/dev/null \
              | grep -v "example\|placeholder\|test\|Test\|add_argument"; then
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "ERROR: potential hardcoded credentials detected (see above)"
            exit 1
          fi
