# WORLDC2 C2 — Example Configuration
# Copy to config.yaml and modify as needed.

server:
  host: "0.0.0.0"
  port: 8443
  max_sessions: 1000
  session_timeout: 300s
  # IPs/CIDRs of reverse proxies in front of the API whose X-Forwarded-For
  # header may be used to resolve real client IPs (rate limiting key).
  # Leave empty when the API is exposed directly — the header is then ignored
  # and cannot be used to bypass per-IP limits.
  trusted_proxies: []

api:
  port: 9090
  # CORS allowlist: exact origins allowed to call the API from another
  # origin. The bundled console is served same-origin and needs no entry.
  # Leave empty for production. A wildcard "*" is rejected at startup.
  # allowed_origins:
  #   - http://localhost:5173

transport:
  http_port: 8445
  ws_port: 8446
  webrtc_port: 8447   # WebRTC data-channel transport (HTTP signaling on the same port); 0 disables
  dns_port: 0          # DNS transport is experimental; 0 disables it
  dns_domains: []

database:
  dsn: "worldc2.db"    # SQLite database file (the only supported backend)
  # Optional: set the WORLDC2_MASTER_KEY environment variable to enable
  # AES-256-GCM at-rest encryption for vault passwords and notes.

tls:
  enabled: true
  auto_cert: true      # Generate a self-signed certificate on first start
  mtls: false          # true = agents MUST present a client certificate issued
                       # via POST /api/mtls/cert and started with
                       # worldc2-agent -tls-cert agent.crt -tls-key agent.key
  # min_version: "1.3" # "1.2" or "1.3" (default floor depends on profile)
  # To use your own certificate instead:
  #   auto_cert: false
  #   cert_file: "certs/server.crt"
  #   key_file: "certs/server.key"
  # Generate one with: python3 scripts/gen_certs.py --domain localhost --days 365

# Operators — the password field must be a bcrypt hash.
# Generate one with:
#   htpasswd -bnBC 10 "" 'YourPassword' | tr -d ':\n'
#   python3 -c "import bcrypt; print(bcrypt.hashpw(b'YourPassword', bcrypt.gensalt()).decode())"
#
# If no operators are configured, the server creates a bootstrap 'admin'
# account with a RANDOM password printed once in the startup log.
#
# The hash below matches the password 'admin' — FOR LOCAL TESTING ONLY.
# CHANGE IT BEFORE ANY REAL USE.
operators:
  - username: "admin"
    password: "$2a$10$yu75.p9O4W2JquxanIvhX.IALFZ37TyXeKFPFtckyHQ5umOpmwiuO"  # bcrypt of 'admin' — FOR TESTING ONLY
    role: "admin"

# Optional logging tuning (defaults: info / stdout)
# logging:
#   level: "info"       # debug | info | warn | error | fatal (or WORLDC2_LOG_LEVEL env)
#   output: "stdout"    # stdout | file
#   file: "worldc2.log"

# Audit-trail policy. The trail (audit_log) records every API call, auth
# event and lifecycle action and is readable in the console (Audit log,
# admin & auditor) and via GET /api/audit. Rows are append-only; the only
# delete path is the retention pruner below.
#
# audit:
#   retention_days: 30  # prune rows older than N days (startup + hourly);
#                       # 0 (default) keeps the trail forever
