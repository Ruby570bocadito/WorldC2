openapi: 3.0.3
info:
  title: WORLDC2 C2 API
  description: Command & Control REST API for red team operations
  version: 2.0.0
  contact:
    name: ruby570bocadito
  license:
    name: MIT

servers:
  - url: http://localhost:9090
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Health:
      type: object
      description: Liveness-only public payload (no operational telemetry)
      properties:
        status:
          type: string
          example: ok

    Status:
      type: object
      description: Authenticated operational telemetry (requires sessions:list)
      properties:
        status:
          type: string
          example: ok
        active_sessions:
          type: integer
          example: 3
        listeners:
          type: integer
          example: 4
        uptime_seconds:
          type: integer
          format: int64
          description: Seconds since server start

    Session:
      type: object
      properties:
        ID:
          type: string
          example: "a1b2c3d4e5f6..."
        AgentID:
          type: string
          example: "agent-12345678"
        Hostname:
          type: string
          example: "DESKTOP-ABC123"
        OS:
          type: string
          example: "windows"
        Arch:
          type: string
          example: "amd64"
        Username:
          type: string
          example: "user"
        IsAdmin:
          type: boolean
        State:
          type: string
          enum: [active, passive, disconnected, killed]
        LastSeen:
          type: string
          format: date-time
        TaskCount:
          type: integer

    TaskRequest:
      type: object
      required: [agent_id, command]
      properties:
        agent_id:
          type: string
          description: Agent ID or hostname
        command:
          type: string
          description: Command to execute
        timeout:
          type: integer
          default: 30
          maximum: 300
          description: Timeout in seconds (max 300)

    TaskResult:
      type: object
      properties:
        task_id:
          type: string
        output:
          type: string
        exit_code:
          type: integer
        success:
          type: boolean
        error_message:
          type: string

    BroadcastRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string

    Credential:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        password:
          type: string
        domain:
          type: string
        host:
          type: string
        service:
          type: string
        captured:
          type: string
          format: date-time

    FileRecord:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        session_id:
          type: string
        module:
          type: string
        size:
          type: integer
        created:
          type: string
          format: date-time

    Module:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        platform:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [ps1, sh, binary, dll]
        commands:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /api/login:
    post:
      summary: Authenticate and obtain a JWT pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                  user:
                    type: string
                  role:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/refresh:
    post:
      summary: Exchange a refresh token for a new JWT pair (one-time use)
      description: >-
        Refresh tokens are ROTATED: the presented token is consumed and the
        response carries a new access token AND a new refresh token. Clients
        must persist the replacement; replaying a consumed refresh token
        returns 401. Legacy refresh tokens without a jti rotate once and the
        replacement is rotatable.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair (token + refresh_token; store both)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                    description: Replacement refresh token (the presented one is now invalid)
                  expires_in:
                    type: integer
        '401':
          description: Invalid, expired or already-consumed refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health:
    get:
      summary: Liveness check (public, telemetry-free)
      tags: [System]
      responses:
        '200':
          description: Server is alive — no session counts, listener details or uptime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/status:
    get:
      summary: Operational telemetry (requires sessions:list)
      tags: [System]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active sessions, listeners and uptime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Missing or invalid token
        '403':
          description: Insufficient permissions

  /api/sessions:
    get:
      summary: List active sessions
      tags: [Sessions]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'

  /api/sessions/{id}:
    get:
      summary: Get session details
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details with tasks
        '404':
          description: Session not found
    delete:
      summary: Kill an agent (optionally hard-delete the record)
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: purge
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            true = hard-delete the session record together with its tasks and
            persisted loot rows in one transaction; default false = keep the
            row as historical record with state "killed".
      responses:
        '200':
          description: Agent killed (or purged when purge=true)
        '404':
          description: Agent not found

  /api/cmd:
    post:
      summary: Execute command on agent
      tags: [Commands]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Command execution failed

  /api/broadcast:
    post:
      summary: Execute command on all agents
      tags: [Commands]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '200':
          description: Results from all agents

  /api/vault:
    get:
      summary: List or search credentials
      tags: [Vault]
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 256
          description: Search query (max 256 characters; longer queries answer 400)
      responses:
        '200':
          description: List of credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
    post:
      summary: Store a credential
      tags: [Vault]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credential'
      responses:
        '200':
          description: Credential stored
    delete:
      summary: Delete a credential (vault:delete required, admin only)
      tags: [Vault]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Credential ID (cred-...)
      responses:
        '200':
          description: Credential deleted
        '403':
          description: Insufficient permissions (vault:delete)
        '404':
          description: Credential not found

  /api/files:
    get:
      summary: List exfiltrated files
      tags: [Files]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileRecord'
    post:
      summary: Upload a file
      tags: [Files]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                filename:
                  type: string
                module:
                  type: string
                data:
                  type: string
                  format: byte
      responses:
        '200':
          description: File stored
    delete:
      summary: Purge all captured files (files:delete required)
      description: >-
        Bulk wipe: removes every exfiltrated artifact everywhere it lives —
        blobs on disk, the current-run listing and the persisted file_records
        rows of previous runs. Requires the files:delete permission (the same
        capability the single-file route enforces, so no role gains a bulk
        action its single-file route lacked). Returns the number of records
        purged; the first hard error aborts the sweep.
      tags: [Files]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All loot purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: purged
                  purged:
                    type: integer
                    description: Number of records removed
        '401':
          description: Missing or invalid token
        '403':
          description: Insufficient permissions (files:delete required)
        '500':
          description: A blob refused to be removed; the sweep aborted

  /api/files/{id}:
    delete:
      summary: Purge a captured file (admin only)
      description: >-
        Removes a single exfiltrated artifact everywhere it lives: the blob in
        the loot directory, the current listing and the persisted record.
        Requires the files:delete permission (admin role).
      tags: [Files]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File purged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: Invalid file id
        '403':
          description: Insufficient permissions (files:delete required)
        '404':
          description: File not found

  /api/modules:
    get:
      summary: List available modules
      tags: [Modules]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
    post:
      summary: Register a new module
      tags: [Modules]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Module'
      responses:
        '200':
          description: Module registered

  /api/modules/push:
    post:
      summary: Push a module to an agent
      tags: [Modules]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module]
              properties:
                module:
                  type: string
                agent_id:
                  type: string
      responses:
        '200':
          description: Module pushed

  /api/socks:
    get:
      summary: List active SOCKS proxies
      tags: [Tunneling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of proxies
    post:
      summary: Start a SOCKS proxy
      tags: [Tunneling]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                port:
                  type: integer
      responses:
        '200':
          description: Proxy started
    delete:
      summary: Stop a SOCKS proxy
      tags: [Tunneling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Proxy stopped

  /api/portfwd:
    get:
      summary: List port forwards
      tags: [Tunneling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of forwards
    post:
      summary: Start port forward
      tags: [Tunneling]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                local_port:
                  type: integer
                remote_host:
                  type: string
                remote_port:
                  type: integer
      responses:
        '200':
          description: Forward started
    delete:
      summary: Stop port forward
      tags: [Tunneling]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Forward stopped

  /api/modules/{name}:
    delete:
      summary: Delete a module
      tags: [Modules]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Module deleted
        '404':
          description: Module not found

  /api/files/download/{id}:
    get:
      summary: Download a captured file
      tags: [Files]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /api/operators:
    get:
      summary: List operators (admin only)
      tags: [Operators]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of operators
        '403':
          description: Admin role required
    post:
      summary: Create an operator (admin only)
      tags: [Operators]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                  description: Plain password; stored as bcrypt hash
                role:
                  type: string
                  enum: [admin, operator, viewer, auditor]
      responses:
        '200':
          description: Operator created

  /api/operators/{id}:
    delete:
      summary: Delete an operator (admin only)
      description: >-
        Deletes the operator account and revokes its outstanding JWTs. The
        revocation is keyed by the operator's username (the JWT subject) and
        backed by an operators-table existence check in the auth middleware,
        so removed tokens stay rejected even across server restarts. An
        unknown or malformed id returns 404/400 instead of a false success.
      tags: [Operators]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operator deleted (response includes the removed username)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  username:
                    type: string
        '400':
          description: Malformed id (not an integer)
        '401':
          description: Missing or invalid token
        '403':
          description: Admin role required
        '404':
          description: Unknown operator id

  /api/notes:
    get:
      summary: List operator notes for a session (collab:read — every role has it)
      tags: [Collaboration]
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of notes
        '400':
          description: Missing session_id
    post:
      summary: Add or update a note for a session
      tags: [Collaboration]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, content]
              properties:
                session_id:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Note saved

  /api/lock:
    post:
      summary: Acquire an exclusive lock on a session
      tags: [Collaboration]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Lock acquired

  /api/profiles:
    get:
      summary: List saved engagement profiles
      tags: [Collaboration]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of profiles
    post:
      summary: Save an engagement profile
      tags: [Collaboration]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile saved

  /api/report:
    get:
      summary: Generate an engagement report
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [text, csv, json]
            default: text
          description: Report format. Unknown values answer 400 (round 14; they used to fall through to the text generator).
        - name: download
          in: query
          schema:
            type: string
            enum: ["1"]
          description: When "1", the report CONTENT is served as an attachment (Content-Disposition, format-appropriate Content-Type). Without it the response is the JSON envelope {path, status}.
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 1
          description: Report window in days (round 15). FILTERS the content — sessions last seen and credentials captured within the window — and stamps StartDate accordingly; it does not merely relabel dates. Out-of-range or non-integer values answer 400.
      responses:
        '200':
          description: >
            Report generation result. Without download=1: JSON envelope with the
            server-side output path and status. With download=1: the report bytes
            (text/csv/json) as a downloadable attachment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  status:
                    type: string
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string

  /api/webhooks:
    get:
      summary: List webhooks (admin only)
      tags: [Webhooks]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of webhooks (persisted; they survive server restarts)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Stable webhook ID used by DELETE /api/webhooks
                    url:
                      type: string
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                    timeout_ms:
                      type: number
                      description: Forwarding timeout in milliseconds (round-13 contract; the raw struct's nanosecond Duration is never serialized)
                    events:
                      type: array
                      items:
                        type: string
                    stats:
                      type: object
                      description: Per-destination delivery ledger (round 15)
                      properties:
                        delivered:
                          type: number
                          description: Successful forwarding attempts
                        failed:
                          type: number
                          description: Failed forwarding attempts (HTTP >= 400 or transport error)
                        last_delivery:
                          type: string
                          description: RFC3339 timestamp of the last attempt (empty if never attempted)
                        last_status:
                          type: string
                          description: '"ok" or "error: ..." (capped at 200 characters)'
    post:
      summary: Register a webhook (admin only)
      description: >-
        Registers and PERSISTS a webhook destination (webhooks table,
        migration 9). It is re-hydrated into the SIEM forwarder on server
        start, so destinations survive restarts.
      tags: [Webhooks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: Absolute http(s) callback URL
                headers:
                  type: object
                  additionalProperties:
                    type: string
                timeout_ms:
                  type: integer
                  description: Forwarding timeout in milliseconds (0 = forwarder default)
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Webhook registered and persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
                    description: Webhook ID (pass it to DELETE /api/webhooks?id=...)
        '400':
          description: Invalid JSON or non-absolute/non-http(s) URL
        '500':
          description: Failed to persist the webhook
    delete:
      summary: Delete a webhook (admin only)
      description: Removes the destination from the forwarder and the database.
      tags: [Webhooks]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Webhook ID returned by POST /api/webhooks
      responses:
        '200':
          description: 'Webhook deleted ("deleted": true)'
        '400':
          description: Missing id query parameter
        '404':
          description: Unknown webhook id

  /api/mtls/cert:
    post:
      summary: Issue an mTLS client certificate (admin only)
      tags: [TLS]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
      responses:
        '200':
          description: 'Issued certificate material (JSON: cert_pem, key_pem, ca_pem)'
