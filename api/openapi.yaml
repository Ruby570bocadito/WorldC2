openapi: 3.0.3
info:
  title: WORLDC2 C2 API
  description: Command & Control REST API for red team operations
  version: 2.0.0
  contact:
    name: ruby570bocadito
  license:
    name: MIT

servers:
  - url: http://localhost:9090
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        active_sessions:
          type: integer
          example: 3
        listeners:
          type: integer
          example: 4
        uptime_seconds:
          type: integer
          format: int64
          description: Seconds since server start

    Session:
      type: object
      properties:
        ID:
          type: string
          example: "a1b2c3d4e5f6..."
        AgentID:
          type: string
          example: "agent-12345678"
        Hostname:
          type: string
          example: "DESKTOP-ABC123"
        OS:
          type: string
          example: "windows"
        Arch:
          type: string
          example: "amd64"
        Username:
          type: string
          example: "user"
        IsAdmin:
          type: boolean
        State:
          type: string
          enum: [active, passive, disconnected, killed]
        LastSeen:
          type: string
          format: date-time
        TaskCount:
          type: integer

    TaskRequest:
      type: object
      required: [agent_id, command]
      properties:
        agent_id:
          type: string
          description: Agent ID or hostname
        command:
          type: string
          description: Command to execute
        timeout:
          type: integer
          default: 30
          maximum: 300
          description: Timeout in seconds (max 300)

    TaskResult:
      type: object
      properties:
        task_id:
          type: string
        output:
          type: string
        exit_code:
          type: integer
        success:
          type: boolean
        error_message:
          type: string

    BroadcastRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string

    Credential:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        password:
          type: string
        domain:
          type: string
        host:
          type: string
        service:
          type: string
        captured:
          type: string
          format: date-time

    FileRecord:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        session_id:
          type: string
        module:
          type: string
        size:
          type: integer
        created:
          type: string
          format: date-time

    Module:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        platform:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [ps1, sh, binary, dll]
        commands:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /api/login:
    post:
      summary: Authenticate and obtain a JWT pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer
                  user:
                    type: string
                  role:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/refresh:
    post:
      summary: Exchange a refresh token for a new JWT pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/health:
    get:
      summary: Server health check
      tags: [System]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/sessions:
    get:
      summary: List active sessions
      tags: [Sessions]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'

  /api/sessions/{id}:
    get:
      summary: Get session details
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details with tasks
        '404':
          description: Session not found
    delete:
      summary: Kill an agent
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent killed
        '404':
          description: Agent not found

  /api/cmd:
    post:
      summary: Execute command on agent
      tags: [Commands]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Command execution failed

  /api/broadcast:
    post:
      summary: Execute command on all agents
      tags: [Commands]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '200':
          description: Results from all agents

  /api/vault:
    get:
      summary: List or search credentials
      tags: [Vault]
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: List of credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
    post:
      summary: Store a credential
      tags: [Vault]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credential'
      responses:
        '200':
          description: Credential stored

  /api/files:
    get:
      summary: List exfiltrated files
      tags: [Files]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileRecord'
    post:
      summary: Upload a file
      tags: [Files]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                filename:
                  type: string
                module:
                  type: string
                data:
                  type: string
                  format: byte
      responses:
        '200':
          description: File stored

  /api/modules:
    get:
      summary: List available modules
      tags: [Modules]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
    post:
      summary: Register a new module
      tags: [Modules]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Module'
      responses:
        '200':
          description: Module registered

  /api/modules/push:
    post:
      summary: Push a module to an agent
      tags: [Modules]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module]
              properties:
                module:
                  type: string
                agent_id:
                  type: string
      responses:
        '200':
          description: Module pushed

  /api/socks:
    get:
      summary: List active SOCKS proxies
      tags: [Tunneling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of proxies
    post:
      summary: Start a SOCKS proxy
      tags: [Tunneling]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                port:
                  type: integer
      responses:
        '200':
          description: Proxy started
    delete:
      summary: Stop a SOCKS proxy
      tags: [Tunneling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Proxy stopped

  /api/portfwd:
    get:
      summary: List port forwards
      tags: [Tunneling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of forwards
    post:
      summary: Start port forward
      tags: [Tunneling]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                local_port:
                  type: integer
                remote_host:
                  type: string
                remote_port:
                  type: integer
      responses:
        '200':
          description: Forward started
    delete:
      summary: Stop port forward
      tags: [Tunneling]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Forward stopped

  /api/modules/{name}:
    delete:
      summary: Delete a module
      tags: [Modules]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Module deleted
        '404':
          description: Module not found

  /api/files/download/{id}:
    get:
      summary: Download a captured file
      tags: [Files]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /api/operators:
    get:
      summary: List operators (admin only)
      tags: [Operators]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of operators
        '403':
          description: Admin role required
    post:
      summary: Create an operator (admin only)
      tags: [Operators]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                  description: Plain password; stored as bcrypt hash
                role:
                  type: string
                  enum: [admin, operator, viewer, auditor]
      responses:
        '200':
          description: Operator created

  /api/operators/{id}:
    delete:
      summary: Delete an operator (admin only)
      tags: [Operators]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operator deleted

  /api/notes:
    get:
      summary: List operator notes for a session
      tags: [Collaboration]
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of notes
        '400':
          description: Missing session_id
    post:
      summary: Add or update a note for a session
      tags: [Collaboration]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, content]
              properties:
                session_id:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Note saved

  /api/lock:
    post:
      summary: Acquire an exclusive lock on a session
      tags: [Collaboration]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Lock acquired

  /api/profiles:
    get:
      summary: List saved engagement profiles
      tags: [Collaboration]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of profiles
    post:
      summary: Save an engagement profile
      tags: [Collaboration]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile saved

  /api/report:
    get:
      summary: Generate an engagement report
      tags: [Reporting]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Report generation result (JSON with output path and status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  status:
                    type: string

  /api/webhooks:
    get:
      summary: List webhooks (admin only)
      tags: [Webhooks]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of webhooks
    post:
      summary: Register a webhook (admin only)
      tags: [Webhooks]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Webhook registered

  /api/mtls/cert:
    post:
      summary: Issue an mTLS client certificate (admin only)
      tags: [TLS]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
      responses:
        '200':
          description: 'Issued certificate material (JSON: cert_pem, key_pem, ca_pem)'
